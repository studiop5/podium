<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Cloud Integration</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background: #5568d3;
    }
    .section {
      margin: 30px 0;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .output {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .error {
      background: #fee;
      color: #c00;
    }
    .success {
      background: #efe;
      color: #060;
    }
    h2 {
      margin-top: 0;
      color: #667eea;
    }
    .note {
      background: #fff9e6;
      padding: 10px;
      border-left: 4px solid #ffd700;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Cloud Provider Integration Test</h1>

  <div class="note">
    <strong>Note:</strong> Before testing, you need to:
    <ul>
      <li>Create OneDrive app at <a href="https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade" target="_blank">Azure Portal</a></li>
      <li>Create Dropbox app at <a href="https://www.dropbox.com/developers/apps" target="_blank">Dropbox App Console</a></li>
      <li>Update client IDs in <code>cloud-identity.js</code></li>
    </ul>
  </div>

  <div class="section">
    <h2>OneDrive</h2>
    <button id="onedrive-login">Login to OneDrive</button>
    <button id="onedrive-list">List PDF Files</button>
    <button id="onedrive-logout">Logout</button>
    <div id="onedrive-output" class="output"></div>
  </div>

  <div class="section">
    <h2>Dropbox</h2>
    <button id="dropbox-login">Login to Dropbox</button>
    <button id="dropbox-list">List PDF Files</button>
    <button id="dropbox-logout">Logout</button>
    <div id="dropbox-output" class="output"></div>
  </div>

  <script type="module" src="test-cloud.js"></script>
</body>
</html>
